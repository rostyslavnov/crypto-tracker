server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # статика
    location / {
        try_files $uri /index.html;
    }

    # прокси на API контейнер (service "api" в docker-compose)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
